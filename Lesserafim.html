<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>💗 LE SSERAFIM</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: #000;
        overflow: hidden;
    }

    canvas {
        position: absolute;
        left: 0; top: 0;
        width: 100%; height: 100%;
    }

    /* Vignette overlay for depth */
    .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center,
            transparent 40%,
            rgba(0,0,0,0.5) 70%,
            rgba(0,0,0,0.85) 100%);
        z-index: 5;
        pointer-events: none;
    }

    /* Subtle scanline texture */
    .scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(0,0,0,0.07) 2px,
            rgba(0,0,0,0.07) 4px
        );
        z-index: 6;
        pointer-events: none;
    }

    /* Animations */
    @keyframes pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1);    letter-spacing: 14px; }
        50%       { transform: translate(-50%, -50%) scale(1.06); letter-spacing: 20px; }
    }

    @keyframes glow-beat {
        0%, 100% { opacity: 0.5; filter: blur(18px); }
        50%       { opacity: 1;   filter: blur(28px); }
    }

    @keyframes shimmer {
        0%   { background-position: -600% center; }
        100% { background-position: 600% center; }
    }

    @keyframes subtitle-fade {
        0%, 100% { opacity: 0.4; letter-spacing: 6px; }
        50%       { opacity: 0.75; letter-spacing: 8px; }
    }

    @keyframes line-expand {
        0%, 100% { width: 60px; opacity: 0.4; }
        50%       { width: 110px; opacity: 0.9; }
    }

    /* Glow blob behind text */
    .logo-glow {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Bebas Neue', 'Arial Black', sans-serif;
        font-size: 100px;
        letter-spacing: 14px;
        white-space: nowrap;
        text-transform: uppercase;
        color: rgba(255, 50, 50, 0);
        text-shadow:
            0 0 20px rgba(255, 80,  80,  1),
            0 0 50px rgba(255, 40,  40,  0.8),
            0 0 90px rgba(200, 0,   0,   0.6),
            0 0 140px rgba(180, 0,  0,   0.3);
        z-index: 8;
        pointer-events: none;
        animation: pulse 2.8s ease-in-out infinite, glow-beat 2.8s ease-in-out infinite;
    }

    /* Main metallic text */
    .logo-text {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Bebas Neue', 'Arial Black', sans-serif;
        font-size: 100px;
        letter-spacing: 14px;
        white-space: nowrap;
        text-transform: uppercase;

        background: linear-gradient(
            175deg,
            #ffffff  0%,
            #f5f5f5  8%,
            #d0d0d0  18%,
            #f0f0f0  28%,
            #a8a8a8  40%,
            #e8e8e8  50%,
            #b0b0b0  60%,
            #f0f0f0  72%,
            #c0c0c0  82%,
            #e8e8e8  90%,
            #808080  100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: contrast(1.5) brightness(1.2);

        z-index: 10;
        animation: pulse 2.8s ease-in-out infinite;
    }

    /* Shimmer sweep */
    .logo-text::after {
        content: 'LE SSERAFIM';
        position: absolute;
        inset: 0;
        background: linear-gradient(
            110deg,
            transparent   20%,
            rgba(255,255,255,0.0)  38%,
            rgba(255,255,255,0.7)  48%,
            rgba(255,255,255,0.95) 50%,
            rgba(255,255,255,0.7)  52%,
            rgba(255,255,255,0.0)  62%,
            transparent   80%
        );
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 4s ease-in-out infinite;
    }

    /* Decorative lines */
    .deco-line-left, .deco-line-right {
        position: absolute;
        top: 50%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,80,80,0.8), rgba(255,200,200,0.9));
        animation: line-expand 2.8s ease-in-out infinite;
        z-index: 10;
    }
    .deco-line-left {
        right: calc(50% + 340px);
        transform: translateY(-50%) scaleX(-1);
    }
    .deco-line-right {
        left: calc(50% + 340px);
        transform: translateY(-50%);
    }

    /* Subtitle */
    .subtitle {
        position: absolute;
        top: calc(50% + 68px);
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Bebas Neue', 'Arial Black', sans-serif;
        font-size: 13px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: rgba(200, 200, 200, 0.5);
        white-space: nowrap;
        z-index: 10;
        animation: subtitle-fade 2.8s ease-in-out infinite;
    }
</style>
</head>
<body>

<canvas id="heart" width="1920" height="947"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>
<div class="logo-glow">LE SSERAFIM</div>
<div class="logo-text">LE SSERAFIM</div>
<div class="deco-line-left"></div>
<div class="deco-line-right"></div>
<div class="subtitle">르세라핌 &nbsp;·&nbsp; Since 2022</div>

<script>
    window.requestAnimationFrame =
        window.__requestAnimationFrame ||
        window.requestAnimationFrame ||
        window.webkitRequestAnimationFrame ||
        window.mozRequestAnimationFrame ||
        window.oRequestAnimationFrame ||
        window.msRequestAnimationFrame ||
        (function () {
            return function (callback, element) {
                var lastTime = element.__lastTime;
                if (lastTime === undefined) { lastTime = 0; }
                var currTime = Date.now();
                var timeToCall = Math.max(1, 33 - (currTime - lastTime));
                window.setTimeout(callback, timeToCall);
                element.__lastTime = currTime + timeToCall;
            };
        })();

    window.isDevice = (/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(
        ((navigator.userAgent || navigator.vendor || window.opera)).toLowerCase()));

    var loaded = false;
    var init = function () {
        if (loaded) return;
        loaded = true;
        var mobile = window.isDevice;
        var koef = mobile ? 0.5 : 1;
        var canvas = document.getElementById('heart');
        var ctx = canvas.getContext('2d');
        var width = canvas.width = koef * innerWidth;
        var height = canvas.height = koef * innerHeight;
        var rand = Math.random;
        ctx.fillStyle = "rgba(0,0,0,1)";
        ctx.fillRect(0, 0, width, height);

        var heartPosition = function (rad) {
            return [Math.pow(Math.sin(rad), 3),
                -(15 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 * rad) - Math.cos(4 * rad))];
        };
        var scaleAndTranslate = function (pos, sx, sy, dx, dy) {
            return [dx + pos[0] * sx, dy + pos[1] * sy];
        };

        window.addEventListener('resize', function () {
            width = canvas.width = koef * innerWidth;
            height = canvas.height = koef * innerHeight;
            ctx.fillStyle = "rgba(0,0,0,1)";
            ctx.fillRect(0, 0, width, height);
        });

        var traceCount = mobile ? 20 : 50;
        var pointsOrigin = [];
        var i;
        var dr = mobile ? 0.3 : 0.1;
        for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 210, 13, 0, 0));
        for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 150, 9, 0, 0));
        for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 90, 5, 0, 0));
        var heartPointsCount = pointsOrigin.length;

        var targetPoints = [];
        var pulse = function (kx, ky) {
            for (i = 0; i < pointsOrigin.length; i++) {
                targetPoints[i] = [];
                targetPoints[i][0] = kx * pointsOrigin[i][0] + width / 2;
                targetPoints[i][1] = ky * pointsOrigin[i][1] + height / 2;
            }
        };

        var e = [];
        for (i = 0; i < heartPointsCount; i++) {
            var x = rand() * width;
            var y = rand() * height;
            e[i] = {
                vx: 0, vy: 0, R: 2,
                speed: rand() + 5,
                q: ~~(rand() * heartPointsCount),
                D: 2 * (i % 2) - 1,
                force: 0.2 * rand() + 0.7,
                f: "hsla(0," + ~~(40 * rand() + 60) + "%," + ~~(60 * rand() + 20) + "%,.3)",
                trace: []
            };
            for (var k = 0; k < traceCount; k++) e[i].trace[k] = {x: x, y: y};
        }

        var config = { traceK: 0.4, timeDelta: 0.01 };
        var time = 0;

        var loop = function () {
            var n = -Math.cos(time);
            pulse((1 + n) * .5, (1 + n) * .5);
            time += ((Math.sin(time)) < 0 ? 9 : (n > 0.8) ? .2 : 1) * config.timeDelta;
            ctx.fillStyle = "rgba(0,0,0,.1)";
            ctx.fillRect(0, 0, width, height);
            for (i = e.length; i--;) {
                var u = e[i];
                var q = targetPoints[u.q];
                var dx = u.trace[0].x - q[0];
                var dy = u.trace[0].y - q[1];
                var length = Math.sqrt(dx * dx + dy * dy);
                if (10 > length) {
                    if (0.95 < rand()) {
                        u.q = ~~(rand() * heartPointsCount);
                    } else {
                        if (0.99 < rand()) { u.D *= -1; }
                        u.q += u.D;
                        u.q %= heartPointsCount;
                        if (0 > u.q) { u.q += heartPointsCount; }
                    }
                }
                u.vx += -dx / length * u.speed;
                u.vy += -dy / length * u.speed;
                u.trace[0].x += u.vx;
                u.trace[0].y += u.vy;
                u.vx *= u.force;
                u.vy *= u.force;
                for (k = 0; k < u.trace.length - 1;) {
                    var T = u.trace[k];
                    var N = u.trace[++k];
                    N.x -= config.traceK * (N.x - T.x);
                    N.y -= config.traceK * (N.y - T.y);
                }
                ctx.fillStyle = u.f;
                for (k = 0; k < u.trace.length; k++) {
                    ctx.fillRect(u.trace[k].x, u.trace[k].y, 1, 1);
                }
            }
            ctx.fillStyle = "rgba(255,255,255,1)";
            for (i = u.trace.length + 13; i--;) ctx.fillRect(targetPoints[i][0], targetPoints[i][1], 2, 2);
            window.requestAnimationFrame(loop, canvas);
        };
        loop();
    };

    var s = document.readyState;
    if (s === 'complete' || s === 'loaded' || s === 'interactive') init();
    else document.addEventListener('DOMContentLoaded', init, false);
</script>
</body>
</html>
